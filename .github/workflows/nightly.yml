name: CADCraft unsigned nightly

# Enabled for supervised manual runs by the reviewed manual actor only; no schedule yet.
# A later explicit opt-in may add a cadence (and turn on nightly-dispatch.yml with it).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    # Actual context guards only; no inherited/platform secrets.
    if: >-
      github.repository == 'storytold/cadcraft' &&
      github.ref == 'refs/heads/main' && github.ref_type == 'branch' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # Maximum for the reusable workflow. Its compiler narrows to contents/actions read;
    # no OIDC, attestation write, release environment or platform secrets in compilation.
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-unsigned.yml@605d58766e8f536564da8fc81d3676ac86816dea
    with:
      tooling-revision: 605d58766e8f536564da8fc81d3676ac86816dea
      app-name: cadcraft
      manual-actors: '["bflatastic","dylanmtaylor","echelon","FredApps","skylartaylor"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      # One producer run builds every listed platform for one all-or-nothing release. The pin is the
      # craft-common-actions main commit that merged #339 (bounded lineage compares), on top of the
      # Linux/macOS signer (#342).
      platforms: '["windows-x86_64","linux-x86_64","macos-aarch64"]'
