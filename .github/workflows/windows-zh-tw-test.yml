# Fork-only: a Windows x64 test build of the Traditional Chinese (zh-TW) interface with the
# 源流明體 GenRyuMin2 TW（月版）font embedded, for native-speaker CAD testing.
#
# Not meant for upstream: it downloads a third-party font at build time and publishes no release
# (the artifacts are attached to a fork prerelease by hand). The font is OFL-1.1; its licence is
# staged next to the binaries by packaging/windows/package.ps1.
name: Windows test build (zh-TW, 源流明體 TW)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the artifact names (default: Cargo.toml version + -zhTW.1)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-zh-tw-test-${{ github.ref }}
  cancel-in-progress: true

env:
  GENRYU_VERSION: v2.100
  # SHA-256 of GenRyuMin2TW-otf.zip from the pinned release.
  GENRYU_ZIP_SHA256: a7b5a531acb30597a7902ef74bd4fd6b606ec47c2c09326eecbaf54875791240

jobs:
  package:
    name: Package (Windows x64, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-zh-tw-test

      - name: Fetch 源流明體 GenRyuMin2 TW（月版）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'GenRyuMin2TW-otf.zip'
          $url = "https://github.com/ButTaiwan/genryu-font/releases/download/$env:GENRYU_VERSION/GenRyuMin2TW-otf.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GENRYU_ZIP_SHA256) { throw "GenRyuMin2TW-otf.zip: sha256 $hash, expected $env:GENRYU_ZIP_SHA256" }
          $out = Join-Path $env:RUNNER_TEMP 'genryu'
          Expand-Archive -Path $zip -DestinationPath $out -Force

          # craft-fonts layout: fonts/manifest.txt + one directory per family with its licence.
          $pack = Join-Path $env:GITHUB_WORKSPACE 'fontpack'
          $dir = Join-Path $pack 'fonts\genryu-min-tw'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $out 'GenRyuMin2TW-R.otf'), (Join-Path $out 'GenRyuMin2TW-B.otf') $dir
          Copy-Item (Join-Path $out 'SIL_Open_Font_License_1.1.txt') (Join-Path $dir 'OFL.txt')

          $source = "https://github.com/ButTaiwan/genryu-font/releases/tag/$env:GENRYU_VERSION"
          # The font names its weights as families (R, B), each with style Regular.
          $manifest = @(
            '# Generated by .github/workflows/windows-zh-tw-test.yml: 源流明體 GenRyuMin2 TW（月版）',
            '# family | style | file | scripts | licence | licence file | sha256 | source',
            "GenRyuMin2 TW R | Regular | fonts/genryu-min-tw/GenRyuMin2TW-R.otf | Hant,Latn | OFL-1.1 | fonts/genryu-min-tw/OFL.txt | $((Get-FileHash (Join-Path $dir 'GenRyuMin2TW-R.otf') -Algorithm SHA256).Hash.ToLower()) | $source",
            "GenRyuMin2 TW B | Regular | fonts/genryu-min-tw/GenRyuMin2TW-B.otf | Hant,Latn | OFL-1.1 | fonts/genryu-min-tw/OFL.txt | $((Get-FileHash (Join-Path $dir 'GenRyuMin2TW-B.otf') -Algorithm SHA256).Hash.ToLower()) | $source"
          )
          Set-Content -Path (Join-Path $pack 'fonts\manifest.txt') -Value $manifest -Encoding utf8
          Get-Content (Join-Path $pack 'fonts\manifest.txt')

      - name: WiX v5 (MSI installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          $env:PATH = "$tools;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}\fontpack
          CRAFT_FONTS_REQUIRED: '1'
          CADCRAFT_VERSION: ${{ inputs.version || '0.13.0-zhTW.1' }}
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Check the font is in the binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generated = Get-ChildItem target -Recurse -Filter craft_fonts.rs -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*x86_64-pc-windows-msvc*' } | Select-Object -First 1
          if (-not $generated) { throw 'no generated craft_fonts.rs: the build ran without CRAFT_FONTS_DIR' }
          if (-not (Select-String -Path $generated.FullName -Pattern 'GenRyuMin2TW-R\.otf' -Quiet)) { throw 'GenRyuMin2TW-R.otf is not embedded' }
          $exe = Get-Item 'target\x86_64-pc-windows-msvc\release\cadcraft.exe'
          Write-Output ("cadcraft.exe: {0:N1} MB" -f ($exe.Length / 1MB))
          if ($exe.Length -lt 30MB) { throw 'cadcraft.exe is too small to carry the two embedded font faces' }

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-ChildItem dist/release -File | Where-Object { $_.Extension -in '.msi', '.zip' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # LF line endings, so `shasum -a 256 -c SHA256SUMS.txt` works on macOS and Linux too.
          $out = Join-Path (Resolve-Path dist/release).Path 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($out, (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          Get-Content $out

      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64-zhTW
          path: |
            dist/release/*.msi
            dist/release/*-portable.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
