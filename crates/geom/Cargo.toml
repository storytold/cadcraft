[package]
name = "cadcraft-geom"
description = "CADCraft geometry: f64 vectors, curves, arcs, splines, intersections, offsets, snaps"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }

# Analytic curves/surfaces and boundary topology (Apache-2.0).
truck-modeling = "0.6"
truck-topology = "0.6"
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation"] }
