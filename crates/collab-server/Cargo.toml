[package]
name = "cadcraft-collab-server"
description = "CADCraft collaboration room: applies operations to an authoritative drawing and answers with the change set"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.30"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[dependencies]
cadcraft-doc = { workspace = true }
cadcraft-collab = { workspace = true }
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
cadcraft-collab-client = { workspace = true }
