[package]
name = "cadcraft-dwg"
description = "CADCraft DWG bridge: converts DWG to and from DXF bytes using the acadrust crate (MPL-2.0, used unmodified)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }

# The same target as build.rs's `no_dwg_bridge` leaves acadrust out: FreeBSD aarch64, where
# acadrust 0.6.6 passes a `*const c_char` (u8 there) to its own `*const i8` sysctlbyname.
# 0.6.7 and 0.6.8 fix that but read some damaged DWGs as empty with no note (tests.rs, #800).
# wasm32 builds it: acadrust uses `web-time` for its clocks and runs its parallel stages
# sequentially there, and it memory-maps files only on native targets.
[target.'cfg(not(all(target_os = "freebsd", target_arch = "aarch64")))'.dependencies]
# MPL-2.0: used as an unmodified dependency only (see plan/adr/0001 and NOTICE).
acadrust = "0.6.6"
