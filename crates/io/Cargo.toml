[package]
name = "cadcraft-io"
description = "CADCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
craft-dxf = { workspace = true }
craft-dwg = { workspace = true }
craft-svg = { workspace = true, features = ["tree-system-fonts"] }
craft-image-codecs = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
craft-pdf = { workspace = true, features = ["write"] }

[dev-dependencies]
miniz_oxide = "0.9"
tiff = "0.11"
image = { workspace = true }
tiny-skia = { workspace = true }
# Reads plotted PDFs back.
craft-pdf = { workspace = true, features = ["read"] }

# Inspect DWG output only where craft-dwg builds its native bridge. An unconditional
# dev-dependency also builds acadrust during --all-targets, breaking FreeBSD aarch64 (#2526).
[target.'cfg(not(any(target_arch = "wasm32", all(target_os = "freebsd", target_arch = "aarch64"))))'.dev-dependencies]
acadrust = "0.6.6"

[dependencies.cfb]
version = "0.16"
[dependencies.emf-core]
version = "0.1.1"
default-features = false
features = ["svg"]
[dependencies.lyon_tessellation]
workspace = true
[dependencies.roxmltree]
version = "0.21"
[dependencies.base64]
version = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }
