[package]
name = "cadcraft-io"
description = "CADCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
craft-dxf = { workspace = true }
cadcraft-dwg = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
miniz_oxide = "0.9"
craft-pdf = { workspace = true, features = ["write"] }
quick-xml = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tiny-skia = { workspace = true }
# Reads plotted PDFs back.
craft-pdf = { workspace = true, features = ["read"] }

# Inspect DWG output only where cadcraft-dwg builds its bridge (every target but FreeBSD aarch64,
# which the xtask test dwg_test_dependency_matches_the_bridge_targets keeps in step). An
# unconditional dev-dependency also builds acadrust during --all-targets, breaking FreeBSD
# aarch64 (#2526).
[target.'cfg(not(all(target_os = "freebsd", target_arch = "aarch64")))'.dev-dependencies]
acadrust = "0.6.6"
