[package]
name = "cadcraft-collab-client"
description = "CADCraft collaboration client: a replica of the drawing, the pending operations and the applied changes"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["ws"]
# The blocking desktop transport (`Session`, `Connection`). The browser build uses `WebSession`
# and its own event queue instead, so it builds with `--no-default-features`.
ws = ["dep:tungstenite"]

[dependencies]
cadcraft-doc = { workspace = true }
cadcraft-collab = { workspace = true }
cadcraft-io = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType", "Window"] }

[dev-dependencies]
serde_json = { workspace = true }
